<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>المهارات الرقمية – رابع | مدرسة سلمة بن الأكوع</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: a single narrow column on a pixel-grid "digital notebook" ground; a navy subject band on top, lesson pages as stacked task sections. */
:root{
  --bg:#edf2f6; --surface:#ffffff; --surface-2:#f5f8fb; --ink:#14283d; --muted:#596b7d; --line:#d3dde6;
  --band:#16324f; --band-ink:#f3f7fb; --band-muted:#a9bfd3;
  --accent:#e8692f; --accent-ink:#ffffff; --teal:#17806f; --sun:#f6c445;
  --ok:#17844e; --ok-bg:#e1f4e8; --bad:#c93b3b; --bad-bg:#fbe4e4;
  --wa:#1f9d55; --grid:rgba(22,50,79,.055);
  --doc:#ffffff; --doc-ink:#1b1b1b; --doc-line:#d9d9d9;
  --motion:#3e7fd6; --pen:#22a06b; --control:#e59a1f;
  --f-display:"Baloo Bhaijaan 2","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1923; --surface:#152331; --surface-2:#1a2b3b; --ink:#e5edf4; --muted:#9db1c3; --line:#26394b;
  --band:#0b2136; --band-ink:#f0f5fa; --band-muted:#8fa9c0;
  --accent:#ff8650; --accent-ink:#1a0c04; --teal:#3fc2ab; --sun:#f6c445;
  --ok:#45d08a; --ok-bg:#143628; --bad:#ff7a7a; --bad-bg:#3b1c1f;
  --wa:#2fbf6c; --grid:rgba(229,237,244,.045);
  --motion:#5b97e8; --pen:#36b981; --control:#eaa634;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1923; --surface:#152331; --surface-2:#1a2b3b; --ink:#e5edf4; --muted:#9db1c3; --line:#26394b;
  --band:#0b2136; --band-ink:#f0f5fa; --band-muted:#8fa9c0;
  --accent:#ff8650; --accent-ink:#1a0c04; --teal:#3fc2ab; --sun:#f6c445;
  --ok:#45d08a; --ok-bg:#143628; --bad:#ff7a7a; --bad-bg:#3b1c1f;
  --wa:#2fbf6c; --grid:rgba(229,237,244,.045);
  --motion:#5b97e8; --pen:#36b981; --control:#eaa634;
  color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px}
#app{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
h1,h2,h3{font-family:var(--f-display);line-height:1.25;text-wrap:balance;margin:0}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* masthead */
.band{background:var(--band);color:var(--band-ink);border-radius:20px;padding:22px 20px 18px;position:relative;overflow:hidden}
.band::after{content:"";position:absolute;inset:auto auto -1px -1px;width:120px;height:72px;
  background:conic-gradient(from 90deg at 0 0,transparent 0 0) ,
  linear-gradient(var(--accent),var(--accent)) 0 48px/24px 24px no-repeat,
  linear-gradient(var(--sun),var(--sun)) 24px 48px/24px 24px no-repeat,
  linear-gradient(var(--teal),var(--teal)) 0 24px/24px 24px no-repeat,
  linear-gradient(var(--accent),var(--accent)) 48px 48px/24px 24px no-repeat;opacity:.9}
.eyebrow{font-size:13px;letter-spacing:.02em;color:var(--band-muted);font-weight:600}
.teacher-band{background:linear-gradient(135deg,#0f5c52,#17806f)}.teacher-band .grade{color:#ffe39a}
.band h1{font-size:clamp(30px,8vw,44px);font-weight:800;margin-top:2px}
.band .grade{font-size:17px;font-weight:600;color:var(--sun)}
.ids{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:16px;padding-inline-end:70px}
.id{display:flex;flex-direction:column;border-top:1px solid rgba(255,255,255,.18);padding-top:8px}
.id small{font-size:12px;color:var(--band-muted)}
.id b{font-weight:600;font-size:15px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.field{display:flex;flex-direction:column;gap:4px;flex:1 1 180px;min-width:0}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],select,textarea{background:var(--surface-2);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;box-sizing:border-box}
textarea{min-height:96px;resize:vertical;line-height:1.8}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:11px 18px;font-weight:700;background:var(--accent);color:var(--accent-ink);text-decoration:none;min-height:46px}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink);font-weight:600}
.btn.teal{background:var(--teal);color:var(--surface)}
.btn.wa{background:var(--wa);color:#fff;font-size:17px}
.btn[aria-disabled=true],.btn:disabled{opacity:.45;pointer-events:none}
.sec-t{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.sec-t h2{font-size:22px}
.sec-t .tag{margin-inline-start:auto}
.tag{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}

/* student */
.hello{display:flex;align-items:center;gap:12px}
.avatar{width:44px;height:44px;border-radius:12px;background:var(--sun);color:#3d2a00;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:22px;flex:none}
.bar{height:10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .4s}

.tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:5px}
.tabs button{flex:1;border:0;background:transparent;border-radius:10px;padding:10px;font-weight:700;color:var(--muted)}
.tabs button[aria-selected=true]{background:var(--band);color:var(--band-ink)}

.unit{display:flex;flex-direction:column;gap:8px}
.unit-h{display:flex;align-items:center;gap:10px;margin-top:6px}
.unit-n{font-family:var(--f-display);font-weight:800;font-size:15px;color:var(--accent)}
.unit-h h3{font-size:20px}
.lesson{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-decoration:none;color:inherit}
.lesson:hover{border-color:var(--accent)}
.lesson .dot{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);border:1.5px dashed var(--line);font-weight:800;font-size:14px;color:var(--muted)}
.lesson.done .dot{background:var(--ok-bg);border:1.5px solid var(--ok);color:var(--ok)}
.lesson.proj{background:var(--surface-2)}
.lesson small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.lesson b{font-weight:700;font-size:16px;display:block;min-width:0}
.lesson .score{font-weight:800;color:var(--ok);font-size:14px}

/* lesson page */
.back{display:inline-flex;gap:6px;align-items:center;color:var(--muted);text-decoration:none;font-weight:600;font-size:14px}
.l-head{display:flex;flex-direction:column;gap:6px}
.l-head .meta{font-size:13px;font-weight:700;color:var(--accent)}
.l-head h1{font-size:clamp(28px,7vw,38px);font-weight:800}
.l-head .ctx{font-size:13px;color:var(--muted)}
.idea{background:var(--surface-2);border-inline-start:4px solid var(--sun);border-radius:10px;padding:12px 14px}
.idea b{display:block;font-size:13px;color:var(--muted)}
.intro{margin-bottom:12px;font-weight:500}
.hint{font-size:14px;color:var(--muted)}
.msg{font-weight:700;font-size:15px;min-height:1.7em}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}
.goals{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:14px}
.goals li{display:flex;gap:8px;align-items:flex-start;color:var(--muted)}
.goals li::before{content:"";flex:none;width:16px;height:16px;margin-top:5px;border-radius:5px;border:2px solid var(--line)}
.goals li.on{color:var(--ink)}
.goals li.on::before{background:var(--ok);border-color:var(--ok);box-shadow:inset 0 0 0 2px var(--surface)}

/* quiz */
.q{display:flex;flex-direction:column;gap:8px;padding-block:6px}
.q+.q{border-top:1px dashed var(--line);padding-top:14px}
.q-t{font-weight:600}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{text-align:start;background:var(--surface-2);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
.opt.ok{background:var(--ok-bg);border-color:var(--ok);font-weight:700}
.opt.bad{background:var(--bad-bg);border-color:var(--bad)}

/* sort */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.pool{padding:10px;border-radius:12px;background:var(--surface-2);min-height:48px;margin-bottom:10px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-weight:600;font-size:15px;text-align:start}
.chip.sel{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.chip.ok{border-color:var(--ok);background:var(--ok-bg)} .chip.bad{border-color:var(--bad);background:var(--bad-bg)}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:10px}
.bucket{border:2px dashed var(--line);border-radius:12px;padding:10px;min-height:90px;display:flex;flex-direction:column;gap:8px;cursor:pointer}
.bucket.ready{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,transparent)}
.bucket-t{font-weight:800;font-family:var(--f-display);font-size:17px}

/* order */
.olist{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:6px;counter-reset:o}
.olist li{counter-increment:o;display:flex;gap:10px;align-items:center;background:var(--surface-2);border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:600}
.olist li::before{content:counter(o);font-weight:800;color:var(--accent);min-width:1.2em}
.olist li.ok{border-color:var(--ok);background:var(--ok-bg)} .olist li.bad{border-color:var(--bad);background:var(--bad-bg)}
.olist .empty{border-style:dashed;color:var(--muted);font-weight:500}
.olist .empty::before{content:""}

/* scenes */
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.prompt{font-weight:700;font-size:16px;background:var(--band);color:var(--band-ink);border-radius:10px;padding:10px 14px;margin-bottom:10px}
.hs-ok{animation:pop .5s;outline:3px solid #2fbf6c!important;outline-offset:1px}
.hs-bad{animation:shake .4s;outline:3px solid #e05050!important}
@keyframes pop{50%{transform:scale(1.08)}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.desk{border-radius:12px;overflow:hidden;background:linear-gradient(160deg,#2c6fb8,#5fb0e8 60%,#9fd3f2);display:flex;flex-direction:column;aspect-ratio:16/10;max-width:100%;border:3px solid #10243a;min-height:240px}
.desk-icons{flex:1;display:grid;grid-template-columns:repeat(auto-fill,76px);grid-auto-rows:min-content;gap:8px;padding:10px;align-content:start}
.d-icon{background:transparent;border:0;border-radius:8px;color:#fff;font-size:12.5px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.d-icon:hover{background:rgba(255,255,255,.18)}
.d-ic svg{width:36px;height:36px;display:block}
.taskbar{background:rgba(12,26,42,.9);display:flex;align-items:center;gap:4px;padding:5px 6px;color:#e6eef5}
.tb{background:transparent;border:0;border-radius:6px;padding:4px 6px;color:#e6eef5;display:flex;align-items:center;gap:4px;font-size:12px;min-height:34px}
.tb svg{width:22px;height:22px}
.tb.search{background:rgba(255,255,255,.12);flex:0 1 110px;color:#c9d6e2}
.tb-gap{flex:1}
.kbd{direction:ltr;display:flex;flex-direction:column;gap:5px;background:#2a3542;padding:8px;border-radius:12px;min-width:600px}
.krow{display:flex;gap:5px}
.key{flex:1 1 0;min-width:0;height:42px;border-radius:7px;border:0;background:#eef2f6;color:#14283d;font-weight:700;font-size:15px;box-shadow:0 3px 0 #9aa8b6}
.key.fn{background:#c9d4df;font-size:12px}
table.sheet{border-collapse:collapse;direction:ltr;font-variant-numeric:tabular-nums;background:var(--doc);color:var(--doc-ink)}
.sheet th{background:#e9eef3;color:#3c4c5c;font-weight:600;font-size:13px;border:1px solid #c5cfd8;padding:4px 8px;min-width:26px}
.sheet td{border:1px solid #d5dde5;min-width:70px;height:34px;padding:0;font-size:14px;text-align:center}
.sheet td[data-hs]{cursor:pointer}
.sheet td input{width:100%;min-width:74px;height:34px;border:0;background:transparent;text-align:center;padding:0 4px;box-sizing:border-box;color:var(--doc-ink)}
.sheet td input:focus{outline:2px solid #1f8a4c;outline-offset:-2px;background:#f2fbf5}
.sheet td input[readonly]{font-weight:600;color:#2a3a4a}
.fbar{display:flex;gap:6px;align-items:center;direction:ltr;margin-bottom:6px;font-size:14px}
.fbar b{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 10px;min-width:40px;text-align:center}
.fbar span{flex:1;border:1px solid var(--line);border-radius:6px;padding:2px 10px;background:var(--surface-2);min-height:1.7em;overflow:hidden;white-space:nowrap}

/* settings */
.mini{border-radius:12px;border:4px solid #10243a;aspect-ratio:16/9;max-width:100%;position:relative;overflow:hidden;transition:background .3s,filter .3s}
.mini .win{position:absolute;inset:16% 18% 24% 18%;border-radius:8px;padding:8px;font-size:12px;transition:background .3s,color .3s}
.mini .vol{position:absolute;bottom:8px;left:8px;right:8px;height:8px;border-radius:9px;background:rgba(0,0,0,.25)}
.mini .vol i{display:block;height:100%;border-radius:9px;background:#fff}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:40px;height:40px;border-radius:10px;border:3px solid transparent;box-shadow:0 0 0 1px var(--line)}
.sw[aria-pressed=true]{border-color:var(--ink)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1.5px solid var(--line);background:var(--surface-2);border-radius:9px;padding:6px 12px;font-weight:600;min-height:38px}
.seg button[aria-pressed=true]{background:var(--band);color:var(--band-ink);border-color:var(--band)}
input[type=range]{width:100%;accent-color:var(--accent)}
.ctrl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:12px}
.ctrl{display:flex;flex-direction:column;gap:6px;min-width:0}
.ctrl>span{font-size:13px;font-weight:700;color:var(--muted)}

/* doc */
.doc{background:var(--doc);color:var(--doc-ink);border:1px solid var(--doc-line);border-radius:6px;padding:22px 20px;min-height:120px;box-shadow:0 2px 0 var(--doc-line)}
.doc p,.doc li{margin:0}
.doc ul{margin:0;padding-inline-start:22px}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;padding:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px}
.tbtn{min-width:40px;height:40px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font-weight:800;padding:0 10px}
.tbtn[aria-pressed=true]{background:var(--band);color:var(--band-ink);border-color:var(--band)}
.tsep{width:1px;background:var(--line);margin-inline:2px}
.words{display:flex;flex-wrap:wrap;gap:6px;font-size:18px;margin-top:8px}
.words span{padding:1px 8px;border-radius:6px}
.words .ok{background:var(--ok-bg);color:var(--ok)} .words .bad{background:var(--bad-bg);color:var(--bad);text-decoration:underline wavy}

/* code */
.code{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:640px){.code{grid-template-columns:1fr 1fr}}
.stage{position:relative;display:grid;background:var(--surface-2);border:2px solid var(--line);border-radius:12px;overflow:hidden;max-width:100%;max-height:380px;margin-inline:auto;width:100%}
.cell{border:1px solid var(--line);display:grid;place-items:center}
.cell svg{width:70%;height:70%}
.cell.wall{background:repeating-linear-gradient(45deg,var(--muted) 0 6px,var(--line) 6px 12px)}
.sprite{position:absolute;top:0;left:0;transition:transform .32s ease;display:grid;place-items:center;pointer-events:none}
.sprite .in{width:82%;height:82%;transition:transform .3s;display:block}
.sprite svg{width:100%;height:100%;display:block}
.sprite.bump .in{animation:shake .35s}
.palette{display:flex;flex-wrap:wrap;gap:6px}
.blk{border:0;border-radius:8px;padding:7px 12px;color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;min-height:40px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.blk.motion{background:var(--motion)} .blk.pen{background:var(--pen)} .blk.control{background:var(--control);color:#2b1a00}
.blk select{background:rgba(255,255,255,.85);border:0;border-radius:6px;padding:2px 4px;width:auto;color:#2b1a00}
.blk button{background:transparent;border:0;color:inherit;font-weight:800;padding:0}
.prog{list-style:none;margin:0;padding:10px;display:flex;flex-direction:column;gap:4px;background:var(--surface-2);border:1.5px dashed var(--line);border-radius:12px;min-height:120px;max-height:300px;overflow:auto}
.prog .blk{width:fit-content}
.prog .blk.now{outline:3px solid var(--ink)}
.prog-empty{color:var(--muted);font-size:14px}
.prog-start{background:#3aa45a;color:#fff;border-radius:8px 8px 8px 0;padding:5px 12px;font-weight:800;width:fit-content;font-size:14px}
canvas.pen{width:100%;max-width:340px;aspect-ratio:1;display:block;margin-inline:auto;border:2px solid var(--line);border-radius:12px;background:var(--surface-2)}

/* slide */
.slide{aspect-ratio:16/9;max-width:100%;border-radius:10px;border:1px solid var(--line);position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:5%;box-sizing:border-box;text-align:center;background:#fff;color:#1b1b1b}
.slide h4{margin:0;font-family:var(--f-display);font-size:clamp(20px,6vw,34px);line-height:1.2;position:relative;z-index:2}
.slide h4.wa{background:linear-gradient(180deg,#ffb347,#e8692f);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(2px 2px 0 rgba(0,0,0,.25))}
.slide p{font-size:clamp(13px,3.5vw,18px);position:relative;z-index:2;opacity:.85}
.slide .pic{position:absolute;inset-inline-start:6%;bottom:8%;max-height:58%;object-fit:contain;z-index:1}
.slide .pic.frame{border:5px solid #fff;box-shadow:0 0 0 2px #888;background:#fff}
.slide .pic.shadow{filter:drop-shadow(6px 8px 6px rgba(0,0,0,.4))}
.slide .pic.round{border-radius:50%;background:#fff;padding:6px;aspect-ratio:1;object-fit:cover}
.pics{display:flex;gap:6px;flex-wrap:wrap}
.pics button{width:54px;height:54px;border-radius:10px;border:2px solid var(--line);background:var(--doc);padding:4px}
.pics button[aria-pressed=true]{border-color:var(--accent)}
.pics img{width:100%;height:100%;object-fit:contain}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.tr-fade{animation:fadeIn .8s}
.tr-push{animation:pushIn .7s}
.tr-zoom{animation:zoomIn .7s}
.an-appear{animation:fadeIn .6s both}
.an-fly{animation:flyIn .7s both}
.an-pulse{animation:pulse .9s 2}
@keyframes fadeIn{from{opacity:0}}
@keyframes pushIn{from{transform:translateX(100%)}}
@keyframes zoomIn{from{transform:scale(.3);opacity:0}}
@keyframes flyIn{from{transform:translateY(120%);opacity:0}}
@keyframes pulse{50%{transform:scale(1.12)}}

/* photo / gallery */

addEventListener('hashchange',route);route();
